    <div class=container style="background-color: rgba(204, 255, 204, 0.644); padding: 30px; color:rgb(78, 40, 46); font-family: 'Saira', sans-serif">
    <h1>Element checker</h1>
    <hr>
    <form>
        <!--Enter input-->
        <label style="font-size: 20px;">Enter The Symbol of a Non-Metal Element</label><br>
        <input type="text" class="form-control form-control-sm w-25 mx-auto" style="font-size: 20px; "id="Element" placeholder="Enter First name"><br>
        <!--Execute-->
        <input type="button" style="font-size: 20px; color: rgb(68, 46, 165); border-radius: 20%; font-family: Saira, sans-serif;" py-click="check_element" value="Enter">
    </form>
    <hr>
    <!--Result appears here-->
    <div id="result" style="font-size: 30px; padding: 30px;"></div>
    </div>

        
    <!-- Python code runs here -->
    <script type="py" src="main.py"></script>
